services:
  acme-converter:
    image: shobuprime/traefik-acme-converter
    container_name: traefik-acme-converter

    # Run as non-root user by default (UID 1000, GID 1000)
    # Uncomment the line below if you need root access (USER_UID=0, USER_GID=0)
    # user: "0:0"

    environment:
      # Directory containing the ACME JSON file
      - WATCH_DIR=/certs

      # Provider name (matches the key in your ACME JSON)
      # The ACME file is automatically set to ${PROVIDER}.json (e.g., cloudflare.json)
      - PROVIDER=cloudflare

      # Output directory for extracted certificates
      - OUTPUT_DIR=/app/output

      # UID/GID for certificate file ownership
      # Default: 1000 (runs as appuser)
      # For root ownership: set to 0 AND uncomment user: "0:0" above
      - USER_UID=1000
      - USER_GID=1000

      # Optional: Periodic fallback check for resiliency (catches missed fsnotify events)
      # Default: 0 (disabled) - relies purely on fsnotify for instant updates
      # - INTERVAL=3600

      # Optional: Enable debug logging
      # - DEBUG=true
    volumes:
      # Mount Traefik's certificate directory (read-only recommended)
      - /custom/example/certs:/certs:ro

      # Mount output directory for extracted certificates
      - /custom/example/_ssl/:/app/output
    restart: unless-stopped
